<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dealer Pak Aji</title>
  <meta name="description" content="Dealer Pak Aji — jual mobil baru & bekas berkualitas, simulasi kredit, dan booking test drive.">
  <meta name="theme-color" content="#0f2a4a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="#/" class="brand" aria-label="Beranda">
        <img src="assets/icon.svg" alt="" width="36" height="36">
        <span><strong data-setting="dealerName">Dealer Pak Aji</strong><small>Mobil Baru &amp; Bekas</small></span>
      </a>
      <nav class="nav" aria-label="Navigasi utama">
        <a href="#/" data-nav="home">Beranda</a>
        <a href="#/katalog" data-nav="katalog">Katalog</a>
        <a href="#/kredit" data-nav="kredit">Simulasi Kredit</a>
        <a href="#/bandingkan" data-nav="bandingkan">Bandingkan <span class="badge" id="compareCount" hidden></span></a>
        <a href="#/kontak" data-nav="kontak">Kontak</a>
      </nav>
      <div class="topbar-actions">
        <a href="#/favorit" class="icon-btn" aria-label="Favorit" title="Favorit">
          <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.6 3.2 5 6.7 5c2 0 3.4 1.1 4.3 2.4h2C13.9 6.1 15.3 5 17.3 5c3.5 0 5.5 3.6 4.2 6.8C19.5 16.4 12 21 12 21z"/></svg>
          <span class="dot" id="favCount" hidden></span>
        </a>
        <a href="#/admin" class="icon-btn" aria-label="Admin" title="Admin">
          <svg viewBox="0 0 24 24"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5z"/></svg>
        </a>
      </div>
    </div>
  </header>

  <main id="app" class="container" tabindex="-1"></main>

  <footer class="footer">
    <div class="container footer-inner">
      <div>
        <strong data-setting="dealerName">Dealer Pak Aji</strong>
        <p data-setting="address"></p>
        <p data-setting="hours"></p>
      </div>
      <div class="footer-links">
        <a href="#/katalog">Katalog</a>
        <a href="#/kredit">Simulasi Kredit</a>
        <a href="#/kontak">Kontak</a>
        <a href="#/admin">Admin</a>
      </div>
    </div>
    <p class="container footer-note">Harga merupakan estimasi OTR dan dapat berubah sewaktu-waktu. © <span id="year"></span> <span data-setting="dealerName">Dealer Pak Aji</span></p>
  </footer>

  <nav class="bottom-nav" aria-label="Navigasi bawah">
    <a href="#/" data-nav="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Beranda</a>
    <a href="#/katalog" data-nav="katalog"><svg viewBox="0 0 24 24"><path d="M5 11l1.6-4.3A2 2 0 0 1 8.5 5.4h7a2 2 0 0 1 1.9 1.3L19 11h1a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-1v1.5a1.5 1.5 0 0 1-3 0V18H8v1.5a1.5 1.5 0 0 1-3 0V18H4a1 1 0 0 1-1-1v-5a1 1 0 0 1 1-1zm2.2 0h9.6l-1.1-3.2a1 1 0 0 0-.9-.6H9.2a1 1 0 0 0-.9.6zM7 15.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm10 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/></svg>Katalog</a>
    <a href="#/kredit" data-nav="kredit"><svg viewBox="0 0 24 24"><path d="M6 2h12a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm1 3v4h10V5zm0 7v2h2v-2zm4 0v2h2v-2zm4 0v6h2v-6zm-8 4v2h2v-2zm4 0v2h2v-2z"/></svg>Kredit</a>
    <a href="#/bandingkan" data-nav="bandingkan"><svg viewBox="0 0 24 24"><path d="M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h5v2h2V1h-2zm0 15H5l5-6zm9-15h-5v2h5v13l-5-6v9h5a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/></svg>Banding</a>
    <a href="#/kontak" data-nav="kontak"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>Kontak</a>
  </nav>

  <a class="wa-float" id="waFloat" href="#" target="_blank" rel="noopener" aria-label="Chat WhatsApp">
    <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.3-.5 0-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.3.5-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.7-.1l1-1.2c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>
  </a>

  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" data-close aria-label="Tutup">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
